name: Autism Django CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  django-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        working-directory: autism_django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django check
        working-directory: autism_django
        env:
          DJANGO_SETTINGS_MODULE: autism_django.settings
        run: python manage.py check

      - name: Apply Migrations
        working-directory: autism_django
        env:
          DJANGO_SETTINGS_MODULE: autism_django.settings
        run: python manage.py migrate

      - name: Run Tests
        working-directory: autism_django
        env:
          DJANGO_SETTINGS_MODULE: autism_django.settings
        run: python manage.py test || echo "✅ No tests defined"
