name: Deploy Django App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout source code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 📦 Install Python dependencies
      run: |
        cd autism_django
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧹 Clean unnecessary files (optional)
      run: |
        find . -name "*.pyc" -delete || true
        find . -name "__pycache__" -exec rm -r {} + || true

    - name: ⚙️ Run Django collectstatic
      run: |
        cd autism_django
        python manage.py collectstatic --noinput

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: autismprediction                             # Azure Web App name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: autism_django                                 # Django project folder
